server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy (the frontend uses relative API URLs, so every backend
    # route must be forwarded to the api service)
    location ~ ^/(tasks|media|health|studio|youtube|mcp)(/.*)?$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;        # required for SSE progress streaming
        proxy_read_timeout 3600s;   # long-running pipeline requests
        proxy_send_timeout 3600s;
    }
}

[package]
name = "novaclip-desktop"
version = "0.1.0"
description = "NovaClip Desktop - One toolkit for every kind of video - clipping, AI creation, agentic editing, repurposing, and packaging."
authors = ["Samuel Olubukun"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.7", features = [] }
tauri-plugin-shell = "2.2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "novaclip-worker"
version = "0.1.0"
edition = "2021"

[lib]
name = "novaclip_worker"
path = "src/lib.rs"

[[bin]]
name = "novaclip-worker"
path = "src/main.rs"

[[bin]]
name = "test_diarize"
path = "src/bin/test_diarize.rs"

[dependencies]
novaclip-db = { path = "../db" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenv = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
vosk = { version = "0.3.1", optional = true }
whisper-rs = { version = "0.14.4", optional = true }
speakrs = { version = "0.5", optional = true }
hound = "3.5"

[features]
default = ["vosk", "whisper", "diarize"]
vosk = ["dep:vosk"]
whisper = ["dep:whisper-rs"]
diarize = ["dep:speakrs"]
